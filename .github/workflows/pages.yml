name: Publish website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build-seo.py --check
      - name: Check mathematics and content contracts
        run: |
          python3 scripts/test-mathematical-corrections.py
          python3 scripts/test-catalogue-mathematics.py
          python3 scripts/test-audit-remediation.py
          python3 scripts/test_build_seo_contract.py
          python3 scripts/test_legacy_complex_redirects.py
          python3 scripts/validate-walkthrough-content-extractor.py
          python3 scripts/audit-site-structure.py
          python3 scripts/validate-site-quality.py
          python3 scripts/check-visual-assets.py
      - run: python3 scripts/build-public.py
      - run: python3 scripts/check-public-output.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4

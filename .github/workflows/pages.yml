name: Publish website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  CALC_REVIEW_DIR: .review/2026-10-12-final
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require the verified artifact publishing source
        run: python3 scripts/check-pages-source.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-seo.py --check
      - name: Check mathematics and content contracts
        run: |
          python3 scripts/test-mathematical-corrections.py
          python3 scripts/test-readiness-fixes.py
          python3 scripts/test-presentation-release.py
          node scripts/test-walkthrough-copy.cjs
          python3 scripts/test-catalogue-mathematics.py
          python3 scripts/test-audit-remediation.py
          python3 scripts/test_build_seo_contract.py
          python3 scripts/test_legacy_complex_redirects.py
          python3 scripts/validate-walkthrough-content-extractor.py
          python3 scripts/audit-site-structure.py
          python3 scripts/validate-site-quality.py
          python3 scripts/check-visual-assets.py
      - run: python3 scripts/build-public.py
      - run: python3 scripts/check-public-output.py
      - run: node scripts/test-walkthrough-copy.cjs
      - run: python3 scripts/check-public-links.py
      - run: python3 scripts/prepare-complex-metadata.py
      - run: python3 scripts/check-complex-initial-metadata.py
      - run: python3 scripts/build-query-release.py
      - run: python3 scripts/check-query-release.py
      - run: node scripts/test-query-routing.cjs
      - name: Verify the query-aware package over HTTP
        run: |
          node "$CALC_REVIEW_DIR/query-release/serve.mjs" &
          calc_query_pid=$!
          trap 'kill "$calc_query_pid"' EXIT
          python3 scripts/test-query-http.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
